version: '3.9'

services:
  app:
    build: .
    container_name: zeroday-airways-app
    command: npm start
    environment:
      PORT: '3000'
      MONGO_URL: 'mongodb://mongo:27017/zeroday'
      SESSION_SECRET: 'devsecret'
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    restart: unless-stopped

  mongo:
    image: mongo:6
    container_name: zeroday-airways-mongo
    ports:
      - '127.0.0.1:${MONGO_HOST_PORT:-27017}:27017'
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
